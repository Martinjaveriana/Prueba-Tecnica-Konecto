services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-konecto}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-konecto}
      POSTGRES_DB: ${POSTGRES_DB:-series76}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
    # Comes back after a crash or a reboot; a "docker compose stop" still keeps it stopped.
    restart: unless-stopped

  backend:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      # Inside Docker the database is the "db" service, not localhost.
      DATABASE_URL: postgresql://${POSTGRES_USER:-konecto}:${POSTGRES_PASSWORD:-konecto}@db:5432/${POSTGRES_DB:-series76}
    ports:
      # Open on every interface, so a phone on the same network can reach it.
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db_data:
